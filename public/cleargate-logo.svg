<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" role="img" aria-label="ClearGate">
<g transform="translate(0 0)">
  <title id="title">ClearGate symbol</title>
  <desc id="desc">A squared navy gate frame around a pharmaceutical product pack with a green verification check and crisp barcode.</desc>
  <!-- Gate: 90-degree frame and feet; only outer foot tips taper at 45 degrees -->
  <path fill="#102431" d="M14 14H106V92H114L120 98H98V22H22V98H0L6 92H14V14Z"/>

  <!-- Product pack: simple 3D carton -->
  <path d="M36 37L60 28L83 37L60 46Z" fill="#102431"/>
  <path d="M36 37L60 46V82L36 74Z" fill="#FFFFFF" stroke="#102431" stroke-width="1.4" stroke-linejoin="miter"/>
  <path d="M60 46L83 37V74L60 82Z" fill="#FFFFFF" stroke="#102431" stroke-width="1.4" stroke-linejoin="miter"/>
  <path d="M36 37L60 46L83 37" fill="none" stroke="#102431" stroke-width="1.4" stroke-linejoin="miter"/>

  <!-- Staggered product copy lines on front/right face -->
  <path d="M65 54L78 50" stroke="#102431" stroke-width="1.9" stroke-linecap="butt"/>
  <path d="M65 60L75 57" stroke="#102431" stroke-width="1.9" stroke-linecap="butt"/>
  <path d="M65 66L72 64" stroke="#102431" stroke-width="1.9" stroke-linecap="butt"/>

  <!-- Verification check -->
  <path d="M66 70L70 74L78 65" fill="none" stroke="#1F6E5D" stroke-width="2.8" stroke-linecap="square" stroke-linejoin="miter"/>

  <!-- Green lower product panel -->
  <path d="M36 74L60 82V101L36 92Z" fill="#1F6E5D"/>
  <path d="M60 82L83 74V92L60 101Z" fill="#1F6E5D"/>

  <!-- Crisp barcode lines -->
  <g fill="#FFFFFF">
    <rect x="42.0" y="79.0" width="1.8" height="12.0" transform="rotate(0 42 79)"/>
    <rect x="45.5" y="80.2" width="1.5" height="12.0"/>
    <rect x="49.0" y="81.4" width="1.8" height="12.0"/>
    <rect x="53.0" y="82.7" width="1.4" height="12.0"/>
    <rect x="56.3" y="83.8" width="1.8" height="12.0"/>
    <rect x="62.2" y="83.8" width="1.8" height="12.0"/>
    <rect x="65.7" y="82.6" width="1.4" height="12.0"/>
    <rect x="69.0" y="81.5" width="1.8" height="12.0"/>
    <rect x="72.8" y="80.2" width="1.5" height="12.0"/>
    <rect x="76.0" y="79.0" width="1.8" height="12.0"/>
  </g>
</g>
<text x="138" y="76" font-family="Aptos, Segoe UI, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="-2"><tspan fill="#102431">Clear</tspan><tspan fill="#1F6E5D">Gate</tspan></text>
</svg>